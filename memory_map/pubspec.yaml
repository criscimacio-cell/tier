name: memory_map
description: A personal + social memory map app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  provider: ^6.1.2
  shared_preferences: ^2.3.5
  uuid: ^4.5.1
  intl: ^0.20.2
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.8.4
  geolocator: ^13.0.2
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
